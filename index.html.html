<head>
<meta charset="UTF-8">

<title>Join Telegram Channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --tg-blue-1:#2AABEE; --tg-blue-2:#229ED9;
    --ink:#1C2733; --muted:#6B7A8D; --card:#ffffff;
    --green:#1E8F5A; --red:#B8322F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%; font-family:'Poppins',sans-serif; color:var(--ink);
    background:radial-gradient(circle at 50% -10%, #EAF6FF 0%, #F4F9FC 45%, #EDF2F6 100%);
  }
  body{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:18px;}

  .page{
    width:100%; max-width:400px; min-height:min(760px,96vh);
    background:var(--card); border-radius:28px;
    box-shadow:0 30px 60px -20px rgba(20,60,90,0.25), 0 0 0 1px rgba(20,60,90,0.05);
    display:flex; flex-direction:column; align-items:center;
    padding:30px 24px 20px; position:relative; overflow:hidden;
  }
  .page::before{
    content:''; position:absolute; top:-120px; left:50%; transform:translateX(-50%);
    width:320px; height:220px; pointer-events:none;
    background:radial-gradient(circle, rgba(42,171,238,0.22) 0%, rgba(42,171,238,0) 70%);
  }

  /* ---------- Icon (moves) ---------- */
  .logo-wrap{position:relative; margin-top:4px; animation:float 3.6s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .logo-ring{
    position:absolute; inset:-10px; border-radius:50%;
    background:linear-gradient(135deg,var(--green),var(--red));
    opacity:0.2; filter:blur(8px); animation:ring-pulse 2.6s ease-in-out infinite;
  }
  @keyframes ring-pulse{0%,100%{transform:scale(1);opacity:0.2;}50%{transform:scale(1.14);opacity:0.38;}}
  .logo{
    width:128px; height:128px; border-radius:50%; overflow:hidden; position:relative;
    border:4px solid #fff;
    box-shadow:0 14px 28px -10px rgba(20,40,60,0.45), 0 0 0 1px rgba(20,40,60,0.08);
    background:linear-gradient(135deg,var(--tg-blue-1),var(--tg-blue-2));
    display:flex; align-items:center; justify-content:center;
  }
  .logo svg{width:64px; height:64px;}

  h1{margin-top:8px; font-size:23px; font-weight:700; letter-spacing:-0.01em; text-align:center;}
  .tagline{margin-top:8px; font-size:14px; font-weight:500; color:var(--tg-blue-2); text-align:center;}
  .desc{margin-top:12px; font-size:13.5px; line-height:1.6; color:var(--muted); text-align:center; max-width:290px;}

  /* ---------- CTA (kept high) ---------- */
  .cta{margin-top:22px; width:100%; position:relative;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    background:linear-gradient(135deg,var(--tg-blue-1),var(--tg-blue-2));
    color:#fff; font-family:'Poppins'; font-weight:600; font-size:16px;
    padding:16px 20px; border-radius:16px; text-decoration:none;
    box-shadow:0 12px 26px -8px rgba(34,158,217,0.55);
    position:relative; z-index:1; cursor:pointer;
  }
  .btn svg{width:19px; height:19px;}

  .free-tag{margin-top:12px; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; font-weight:500; color:var(--muted);}
  .free-tag .dot{width:7px; height:7px; border-radius:50%; background:#3FB68A; box-shadow:0 0 0 3px rgba(63,182,138,0.2); animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .stats{margin-top:26px; width:100%; display:flex; border-top:1px solid #EEF2F6; padding-top:18px;}
  .stat{flex:1; text-align:center;}
  .stat .n{font-weight:700; font-size:16px;}
  .stat .l{font-size:10.5px; color:var(--muted); margin-top:3px; text-transform:uppercase; letter-spacing:0.03em;}

  .spacer{flex:1;}
  .ads{width:100%; margin-top:24px; text-align:center; font-size:11px; color:var(--muted);}
  .ads a{color:var(--tg-blue-2); font-weight:500; text-decoration:none;}
  .ads a:hover{text-decoration:underline;}

  footer{
    width:100%; margin-top:14px; padding-top:14px; border-top:1px solid #EEF2F6;
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px;
  }
  footer a{font-size:10.5px; color:var(--muted); text-decoration:none;}
  footer a:hover{color:var(--tg-blue-2);}

  @media (prefers-reduced-motion: reduce){
    .logo-wrap,.logo-ring,.free-tag .dot{animation:none !important;}
  }
</style>
